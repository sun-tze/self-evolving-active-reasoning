  <g id="text_19">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #47555c" transform="translate(11.11176 394.722838)">Same 25-turn histories and model final cap. Solver supplies the answer on singleton cases.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #47555c" transform="translate(11.11176 405.525299)">The model adds no overall EM over the direct solver. Shared interaction cost remains.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #47555c" transform="translate(11.11176 416.32776)">One model/decoding setup; outcome-informed follow-up, not evidence of learned reasoning.</text>
  </g>
